[package]
name = "todo"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.3", features = ["derive", "env"] }
tokio = { version = "1.36.0", features = ["full"] }
axum = {version = "0.8.4" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "macros", "sqlite", "chrono"] }
chrono = { version = "0.4.38", features = ["serde"] }
